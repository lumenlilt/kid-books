<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2b2340" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>魔法書房</title>
    <style>
      /* 開機畫面：JS 還沒跑、模型還在下載時就看得到東西——2026-09-13 iPhone 首次開啟只有一片紫底十幾秒，使用者以為壞了。
         行內樣式而不放 styles.css：styles.css 跟著 JS 模組載入，模組掛掉它也沒有。 */
      #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #fff3dc; transition: opacity .4s ease; }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot img { width: 128px; height: 128px; border-radius: 28px; animation: boot-bob 1.1s ease-in-out infinite; }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .boot-dots { display: flex; gap: 10px; }
      .boot-dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff9f5a; animation: boot-dot 1.2s ease-in-out infinite; }
      .boot-dots i:nth-child(2) { animation-delay: .2s } .boot-dots i:nth-child(3) { animation-delay: .4s }
      @keyframes boot-dot { 0%, 80%, 100% { opacity: .3; transform: scale(.8) } 40% { opacity: 1; transform: scale(1.15) } }
      .boot-bar { width: min(60vw, 260px); height: 8px; border-radius: 4px; background: rgba(0,0,0,.08); overflow: hidden; }
      .boot-bar b { display: block; width: 4%; height: 100%; border-radius: 4px; background: #ff9f5a; transition: width .3s ease; }
      /* 20 秒還沒好就露出重新載入（純 CSS 計時，JS 掛掉也會出現；連結不用 script，CSP 放行） */
      .boot-retry { opacity: 0; animation: boot-reveal 0s 20s forwards; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        background: #fff; color: #3a2e2a; font: 700 32px/1 system-ui, sans-serif; text-decoration: none; box-shadow: 0 6px 0 rgba(0,0,0,.12); }
      @keyframes boot-reveal { to { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" width="128" height="128" />
      <div class="boot-dots"><i></i><i></i><i></i></div>
      <div class="boot-bar"><b></b></div>
      <a class="boot-retry" href=".">&#x21bb;</a>
    </div>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
